    <noscript>
      <h1>CrossFit WOD Intelligence</h1>
      <p>
        CrossFit WOD Intelligence is a data-science web app from Persistence Athletics
        that analyzes more than 6,800 CrossFit Workouts of the Day published on
        crossfit.com over 25 years (February 2001 to today). It charts how programming
        has evolved across movements, energy systems, work capacity, and structural
        balance, surfacing the gaps and patterns in a quarter century of CrossFit
        methodology. This site needs JavaScript to load its interactive charts and 3D
        visualizations, but the sections below are reachable directly.
      </p>
      <ul>
        <li><a href="/">CrossFit WOD Intelligence (daily WOD analysis and 25-year database)</a></li>

        <li><a href="/fitness">What Is Fitness? (an interactive lesson on the CrossFit fitness model)</a></li>
      </ul>
