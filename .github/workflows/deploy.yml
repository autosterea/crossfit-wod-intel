name: Publish redirect to GitHub Pages

# The app moved to https://wod.persistenceathletics.com/ on 2026-05-31.
# This workflow publishes a tiny redirect page to GH Pages so any old
# inbound links still find the new site.
#
# MANUAL-ONLY (2026-07-02): the redirect page is already published and lives on
# GH Pages permanently. Running this on every push added no value and kept
# failing on GitHub's Pages backend (deployments stuck in "queued"), sending a
# failure email each push. It now runs only when triggered by hand from the
# Actions tab, which is all the near-dead old URL ever needs.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare redirect artifact
        run: |
          mkdir -p _redirect_site
          cp gh-pages-redirect/index.html _redirect_site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _redirect_site
      - id: deployment
        uses: actions/deploy-pages@v4
