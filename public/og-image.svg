<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#0f1629"/>
    </linearGradient>

    <!-- Title gradient: blue to purple to rose -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Accent line glow -->
    <linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="15%" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#ec4899" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <!-- Blue stat box bg -->
    <linearGradient id="blueBoxBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f2440" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Green stat box bg -->
    <linearGradient id="greenBoxBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a2a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f2a1a" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Purple stat box bg -->
    <linearGradient id="purpleBoxBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1f5e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a1040" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Rose stat box bg -->
    <linearGradient id="roseBoxBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a1942" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2a0f28" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="titleGlow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambientGlow">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#60a5fa" stroke-width="0.5" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern overlay -->
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Ambient glow spots for depth -->
  <ellipse cx="280" cy="280" rx="300" ry="200" fill="#3b82f6" opacity="0.04" filter="url(#ambientGlow)"/>
  <ellipse cx="950" cy="350" rx="280" ry="200" fill="#8b5cf6" opacity="0.04" filter="url(#ambientGlow)"/>
  <ellipse cx="600" cy="500" rx="400" ry="150" fill="#ec4899" opacity="0.02" filter="url(#ambientGlow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#lineGlow)" opacity="0.8"/>

  <!-- === LEFT SIDE: Title Area === -->

  <!-- Main title line 1 -->
  <text x="80" y="240" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="72" fill="url(#titleGrad)" filter="url(#titleGlow)">CrossFit WOD</text>

  <!-- Main title line 2 -->
  <text x="80" y="320" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="72" fill="url(#titleGrad)" filter="url(#titleGlow)">Intelligence</text>

  <!-- Subtitle -->
  <text x="84" y="370" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#94a3b8" letter-spacing="0.5">25 Years of Programming Data — Analyzed</text>

  <!-- Small decorative line under subtitle -->
  <rect x="84" y="388" width="200" height="2" rx="1" fill="url(#lineGlow)" opacity="0.6"/>

  <!-- === RIGHT SIDE: 2x2 Stat Grid === -->

  <!-- Row 1, Col 1: 6,779 Workouts (blue) -->
  <g transform="translate(700, 175)">
    <rect width="210" height="105" rx="14" fill="url(#blueBoxBg)" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.35"/>
    <text x="105" y="48" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="700" font-size="36" fill="#60a5fa">6,779</text>
    <text x="105" y="76" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="15" fill="#93c5fd" opacity="0.85">Workouts</text>
  </g>

  <!-- Row 1, Col 2: 80 Movements (green) -->
  <g transform="translate(940, 175)">
    <rect width="210" height="105" rx="14" fill="url(#greenBoxBg)" stroke="#22c55e" stroke-width="1" stroke-opacity="0.35"/>
    <text x="105" y="48" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="700" font-size="36" fill="#4ade80">80</text>
    <text x="105" y="76" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="15" fill="#86efac" opacity="0.85">Movements</text>
  </g>

  <!-- Row 2, Col 1: 25 Years (purple) -->
  <g transform="translate(700, 305)">
    <rect width="210" height="105" rx="14" fill="url(#purpleBoxBg)" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.35"/>
    <text x="105" y="48" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="700" font-size="36" fill="#a78bfa">25</text>
    <text x="105" y="76" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="15" fill="#c4b5fd" opacity="0.85">Years</text>
  </g>

  <!-- Row 2, Col 2: Free / Open Source (rose) -->
  <g transform="translate(940, 305)">
    <rect width="210" height="105" rx="14" fill="url(#roseBoxBg)" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.35"/>
    <text x="105" y="48" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="700" font-size="36" fill="#fb7185">Free</text>
    <text x="105" y="76" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="15" fill="#fda4af" opacity="0.85">Open Source</text>
  </g>

  <!-- === BOTTOM AREA === -->

  <!-- Bottom separator -->
  <rect x="60" y="540" width="1080" height="1" fill="#1e293b" opacity="0.6"/>

  <!-- Creator credit (bottom-left) -->
  <text x="80" y="580" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="400" font-size="14" fill="#64748b">Created by Ravikant Dewangan | MS S&amp;C | CCFT | Head Coach, Persistence Athletics</text>

  <!-- URL (bottom-right) -->
  <text x="1120" y="580" text-anchor="end" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="14" fill="#64748b">autosterea.com</text>

  <!-- Bottom accent line -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#lineGlow)" opacity="0.8"/>
</svg>