<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="20%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#60a5fa" stroke-width="0.5">
    <!-- Vertical lines -->
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="63" x2="1200" y2="63"/>
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="189" x2="1200" y2="189"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="441" x2="1200" y2="441"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="0" y1="567" x2="1200" y2="567"/>
  </g>

  <!-- Decorative graph curve suggesting data visualization -->
  <g opacity="0.12">
    <polyline fill="none" stroke="url(#lineGlow)" stroke-width="2"
      points="0,450 80,440 160,420 240,380 320,400 400,350 480,330 560,300 640,320 720,280 800,250 880,270 960,220 1040,200 1120,180 1200,160"/>
    <polyline fill="none" stroke="url(#lineGlow)" stroke-width="1.5"
      points="0,500 80,490 160,470 240,460 320,430 400,440 480,410 560,390 640,400 720,370 800,340 880,350 960,310 1040,290 1120,270 1200,250"/>
  </g>

  <!-- Decorative scatter dots suggesting a network graph -->
  <g opacity="0.08" fill="#60a5fa">
    <circle cx="150" cy="120" r="3"/>
    <circle cx="280" cy="90" r="2"/>
    <circle cx="350" cy="150" r="4"/>
    <circle cx="480" cy="100" r="2.5"/>
    <circle cx="620" cy="130" r="3"/>
    <circle cx="750" cy="80" r="2"/>
    <circle cx="900" cy="110" r="3.5"/>
    <circle cx="1020" cy="95" r="2"/>
    <circle cx="1080" cy="140" r="3"/>
  </g>
  <g opacity="0.06" stroke="#8b5cf6" stroke-width="0.5">
    <line x1="150" y1="120" x2="280" y2="90"/>
    <line x1="280" y1="90" x2="350" y2="150"/>
    <line x1="350" y1="150" x2="480" y2="100"/>
    <line x1="480" y1="100" x2="620" y2="130"/>
    <line x1="620" y1="130" x2="750" y2="80"/>
    <line x1="750" y1="80" x2="900" y2="110"/>
    <line x1="900" y1="110" x2="1020" y2="95"/>
    <line x1="1020" y1="95" x2="1080" y2="140"/>
  </g>

  <!-- Ambient glow spots -->
  <circle cx="300" cy="315" r="200" fill="#3b82f6" opacity="0.03" filter="url(#softGlow)"/>
  <circle cx="900" cy="315" r="200" fill="#8b5cf6" opacity="0.03" filter="url(#softGlow)"/>

  <!-- Title -->
  <text x="600" y="235" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="58" fill="url(#titleGrad)" filter="url(#glow)">CrossFit WOD Intelligence</text>

  <!-- Subtitle -->
  <text x="600" y="285" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="24" fill="#94a3b8">25 Years of Programming Data — Analyzed</text>

  <!-- Divider line -->
  <rect x="400" y="310" width="400" height="1.5" rx="1" fill="url(#lineGlow)" opacity="0.5"/>

  <!-- Stat boxes -->
  <!-- 6,779 WODs — Blue -->
  <g transform="translate(128, 350)">
    <rect width="210" height="80" rx="12" fill="#1e3a5f" opacity="0.6" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
    <text x="105" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600" font-size="28" fill="#60a5fa">6,779</text>
    <text x="105" y="60" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="14" fill="#93c5fd" opacity="0.8">WODs Analyzed</text>
  </g>

  <!-- 80 Movements — Green -->
  <g transform="translate(378, 350)">
    <rect width="210" height="80" rx="12" fill="#1a3a2a" opacity="0.6" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
    <text x="105" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600" font-size="28" fill="#4ade80">80</text>
    <text x="105" y="60" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="14" fill="#86efac" opacity="0.8">Movements</text>
  </g>

  <!-- 25 Years — Purple -->
  <g transform="translate(628, 350)">
    <rect width="210" height="80" rx="12" fill="#2d1f5e" opacity="0.6" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3"/>
    <text x="105" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600" font-size="28" fill="#a78bfa">25</text>
    <text x="105" y="60" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="14" fill="#c4b5fd" opacity="0.8">Years of Data</text>
  </g>

  <!-- Open Source — Rose -->
  <g transform="translate(878, 350)">
    <rect width="210" height="80" rx="12" fill="#4a1942" opacity="0.6" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.3"/>
    <text x="105" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600" font-size="28" fill="#fb7185">Free</text>
    <text x="105" y="60" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="14" fill="#fda4af" opacity="0.8">Open Source</text>
  </g>

  <!-- Footer URL -->
  <text x="600" y="530" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="400" font-size="14" fill="#475569">autosterea.github.io/crossfit-wod-intel</text>

  <!-- Bottom border accent -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#lineGlow)"/>
</svg>
